[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn-saas"
version = "0.1.0"
description = "Détection de résiliation client SaaS B2B — livrable CISIA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=16",
    "joblib>=1.4",
    "typer>=0.12",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "python-pptx>=1.0.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.1",
    "optuna>=3.6",
    "shap>=0.45",
    "imbalanced-learn>=0.12",
    "codecarbon>=2.4",
]
mlops = [
    "mlflow>=2.14",
    "dvc>=3.51",
    "evidently>=0.4",
    "prefect>=3.0",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
churn-saas = "churn_saas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_saas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: tests longs (entraînement ML en CV) — exclus du make check rapide",
]
