[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn-saas"
version = "0.1.0"
description = "Détection de résiliation client SaaS B2B — livrable CISIA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=16",
    "joblib>=1.4",
    "typer>=0.12",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "python-pptx>=1.0.2",
    "reportlab>=4.2",
    "skops>=0.15",
]

[project.optional-dependencies]
ml = [
    "optuna>=3.6",
    "shap>=0.45",
    "imbalanced-learn>=0.12",
    "codecarbon>=3.3",
    "lightgbm>=4.7.0",
]
mlops = [
    "mlflow>=2.14",
    # Sans pip dans le venv uv, MLflow écrit « pip » sans version dans le conda.yaml du modèle
    "pip>=24",
    "dvc>=3.51",
    "evidently>=0.4",
    "prefect>=3.0",
]
api = [
    "fastapi>=0.116.2",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7",
    "httpx2>=2.13.1",
    # 0.48 : constantes HTTP_422_UNPROCESSABLE_CONTENT / HTTP_413_CONTENT_TOO_LARGE (RFC 9110)
    "starlette>=0.48",
    "lightgbm>=4.7.0",
]
demo = [
    "streamlit>=1.35",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "playwright>=1.45",
]

[project.scripts]
churn-saas = "churn_saas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_saas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Les sections sont concaténées en un seul notebook : les variables définies dans une section
# précédente (df_brut, date_reference…) sont inconnues de ruff, qui analyse chaque fichier seul
"notebooks/sections/*.py" = ["F821"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# flows/, scripts/… ne sont pas des paquets : chemins de module résolus depuis la racine
explicit_package_bases = true
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# `flows/` n'est pas un paquet installé : la racine du dépôt doit être importable
# pour que les tests puissent charger les flows Prefect comme le fait le notebook.
pythonpath = ["."]
markers = [
    "slow: tests longs (entraînement ML en CV) — exclus du make check rapide",
]
# Dépréciations émises à l'import par des dépendances tierces, sans correctif possible de notre
# côté : filtrées par module d'origine pour ne jamais masquer un avertissement de notre code.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    "ignore:The set_(bad|over|under) function will be deprecated:PendingDeprecationWarning:shap.plots.colors._colors",
]
