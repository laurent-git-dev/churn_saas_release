# Charge automatiquement monitoring/grafana/dashboard.json (monté sur /var/lib/grafana/dashboards).
apiVersion: 1

providers:
  - name: churn_saas
    folder: Churn SaaS
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
