# prefect.yaml — configuration des déploiements Prefect 3 pour le projet churn-saas
#
# Usage :
#   Installation  : uv sync --extra mlops
#   Déploiement   : uv run prefect deploy --all
#   Run manuel    : uv run prefect deployment run batch-scoring-nocturne/nocturne
#   Serveur local : uv run prefect server start  (optionnel — chaque flow s'exécute aussi en local runner)
#
# Sans serveur, les flows s'exécutent en mode "local runner" depuis le notebook ou via
# `make flow` et `make drift`. Le présent fichier décrit la configuration de production :
#   - nocturne              : scoring de tous les comptes, chaque nuit (§10) ;
#   - derive-hebdomadaire   : rapport de dérive, chaque lundi avant la revue (§13.4) ;
#   - sur-decision-comite   : réentraînement, SANS planification — lancé à la main sur décision
#                             du comité de revue (§13.8 : aucun signal ne réentraîne seul).

# Nom du projet Prefect — correspond au namespace affiché dans l'UI Prefect
name: churn-saas

# Version du moteur Prefect ciblée
prefect-version: "3.x"

# ---------------------------------------------------------------------------
# Définitions des déploiements
# Un déploiement = une version planifiable d'un flow (horaire, paramètres, infra)
# ---------------------------------------------------------------------------
deployments:

  - name: nocturne
    # Identifiant du flow : chemin_du_fichier:nom_de_la_fonction
    entrypoint: flows/scoring_batch.py:batch_scoring_nocturne

    # --- Planification ---
    # Expression cron : minute heure jour_du_mois mois jour_de_la_semaine
    # "0 2 * * *" = chaque nuit à 2h00 — fenêtre creuse avant la synchronisation CRM (6h)
    schedule:
      cron: "0 2 * * *"
      timezone: "Europe/Paris"

    # --- Paramètres du flow ---
    # date_ref laissé à None → le flow utilise la date du jour automatiquement
    parameters:
      date_ref: null

    # --- Gestion des erreurs ---
    # En production, ajouter ici les notifications Slack (voir docs Prefect automations)
    # notifications: []

    # --- Infrastructure ---
    # Par défaut : process worker local (aucun Docker ni Kubernetes requis)
    # Pour un déploiement cloud : remplacer par un work-pool Kubernetes ou ECS
    work_pool:
      name: default-agent-pool   # à créer via `prefect work-pool create default-agent-pool`
      # job_variables:
      #   image: ghcr.io/<compte>/churn-saas:latest   # si Docker activé

    # --- Idempotence ---
    # Le flow est idempotent sur la date : relancer deux fois la même nuit n'écrase pas les scores
    # (voir flows/scoring_batch.py — task publier_scores)

  - name: derive-hebdomadaire
    entrypoint: monitoring/drift_report.py:main
    # Chaque lundi à 05 h 00 : rapport prêt pour la revue du lundi, après le batch de 02 h 00
    schedule:
      cron: "0 5 * * 1"
      timezone: "Europe/Paris"
    work_pool:
      name: default-agent-pool

  - name: sur-decision-comite
    entrypoint: flows/retraining.py:flow_retrainement
    # Aucune planification, volontairement : une dérive peut venir d'une panne de données, qu'un
    # réentraînement apprendrait au lieu de la corriger. Le comité décide, puis lance :
    #   uv run prefect deployment run reentrainement-churn/sur-decision-comite
    # La promotion reste décidée par la seule gate (stage_gate), sans contournement possible.
    parameters:
      forcer: false
    work_pool:
      name: default-agent-pool
