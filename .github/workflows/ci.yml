name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Installer Python 3.12
        run: uv python install 3.12

      - name: Installer les dépendances (tous les extras)
        run: uv sync --all-extras

      # Mêmes cibles qu'en local : les chemins vérifiés ne sont définis qu'une fois (Makefile)
      - name: Lint (ruff, black, mypy)
        run: make lint

      - name: Tests rapides
        run: make test

      - name: Gate qualité modèle (slow)
        run: make test-slow

  cd:
    name: Publication image Docker
    runs-on: ubuntu-latest
    needs: qualite
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Construire l'image en local d'abord : on ne publie qu'une image qui démarre réellement
      - name: Build local de l'image (test de fumée)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: churn-saas-api:fumee

      # Pas de modèle en CI (artifacts/ non versionné) : /health doit répondre 200,
      # /ready 503 (service dégradé mais vivant). On vérifie aussi l'utilisateur non-root.
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name fumee -p 8000:8000 churn-saas-api:fumee
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' fumee)" != "true" ]; then
              echo "Le conteneur s'est arrêté au démarrage"; docker logs fumee; exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health > /dev/null \
            || { echo "/health ne répond pas après 60 s"; docker logs fumee; exit 1; }
          echo "/ready : HTTP $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)"
          uid=$(docker exec fumee id -u)
          [ "$uid" != "0" ] || { echo "Le conteneur tourne en root"; exit 1; }
          echo "Utilisateur du conteneur : uid=$uid"
          docker rm -f fumee

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
